bind = "127.0.0.1:8799"
database_url = "sqlite://./data/friday.db?mode=rwc"
timezone = "UTC"
mode = "auto"
workspaces = []

[model]
provider = "nebius"
nebius_base_url = "https://api.tokenfactory.nebius.com/v1"
nebius_model = "nvidia/nemotron-3-super-120b-a12b"
ollama_base_url = "http://127.0.0.1:11434"
ollama_model = "llama3.1"
max_tokens = 2048
temperature = 0.20000000298023224
request_timeout_secs = 120

[agents]
max_concurrent_subagents = 3
hard_max_subagents = 5
max_subagent_depth = 1
max_iterations = 12
max_tool_calls = 24
run_timeout_secs = 300
subagent_timeout_secs = 120
tool_timeout_secs = 60

[permissions]
allow_network = true
allow_local_mutation = true
allow_external_side_effect = false
allow_privileged = false
command_allowlist = [
    "cargo",
    "git",
    "npm",
]
max_file_bytes = 524288
max_tool_output_bytes = 65536
confirm_hosted_uploads = false

[skills]
user_dir = "/home/kairav/.config/friday/skills"
project_dir = ".friday/skills"
allow_scripts = false

[briefing]
enabled = true
at_time = "07:30"
email_provider = "synthetic"
calendar_provider = "synthetic"

[research]
search_provider = "tavily"
max_sources = 6
max_page_bytes = 200000
